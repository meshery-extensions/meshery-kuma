name: Test Kuma Adapter

on:
  push:
    branches:
      - "*"
    tags:
      - "v*"
    paths-ignore:
    - 'docs/**'     
  pull_request:
    branches:
      - "*"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  SetPatternfile:
    runs-on: ubuntu-latest
    outputs:
      sm_version: ${{ steps.gettag.outputs.release }}
      adapter_version:  ${{ env.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@master
      - name: Get version of adapter
        run: |
            if [ ${{ github.event_name }} == "release" ];then
                echo "version=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV
            else 
                echo "version=edge" >> $GITHUB_ENV
            fi
      - name: Get latest release tag
        id: gettag
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          repository: kumahq/kuma
          excludes: prerelease, draft
      - name: Change service mesh version in patternfile
        env:
          KUMA_VERSION: ${{ steps.gettag.outputs.release }}
        run: | 
           yq e -i '.services.kuma.version = strenv(KUMA_VERSION)' ./.github/install/deploy.yaml
           cat ./.github/install/deploy.yaml
      - name: Uploading file
        uses: actions/upload-artifact@v4
        with:
          name: patternfile
          path: ./.github/install/deploy.yaml 

  TestKuma:
    needs: SetPatternfile
    strategy:
      fail-fast: false
      matrix:
        k8s_version: ["v1.31.4", "v1.32.0"]
    runs-on: ubuntu-24.04
    steps:
      - name: Setting up minikube
        uses: manusa/actions-setup-minikube@v2.13.0
        with:
          minikube version: "v1.34.0"
          kubernetes version: "${{ matrix.k8s_version }}"
          driver: docker
          start args: --cni "bridge"
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Build the tagged Docker image
        run: |
          eval $(minikube -p minikube docker-env)
          docker build -t test:test .
      - name: Retrieve kubeconfig
        run: |
          kubectl config view --minify --flatten > ~/.kube/configtemp
          mv ~/.kube/configtemp ~/.kube/config
      - name: Setup meshery config and infinite token for use
        env:
          provider_token: ${{ secrets.PROVIDER_TOKEN }}
        run: |
          if [ -n "$provider_token" ]; then
            echo "::add-mask::$provider_token"
          fi
          mkdir -p ~/.meshery
          echo '{"contexts":{"local":{"endpoint":"http://localhost:9081","token":"default","platform":"kubernetes","components":[],"channel":"stable","version":"latest"}},"current-context":"local","tokens":[{"location":"auth.json","name":"default"}]}' > ~/.meshery/config.yaml
          echo '{ "meshery-provider": "Local", "token": "" }' > ~/.meshery/auth.json
          chmod 600 ~/.meshery/auth.json
      - name: Start Meshery Server using mesheryctl
        run: curl -L https://meshery.io/install | PLATFORM=kubernetes bash -
      - name: Start adapter
        run: |
          curl https://raw.githubusercontent.com/meshery/meshery/master/install/deployment_yamls/k8s/meshery-kuma-deployment.yaml > ./testimagedep.yaml
          yq e -i '.spec.template.spec.containers[0].image="test:test"' ./testimagedep.yaml
          yq e -i '.spec.template.spec.containers[0].imagePullPolicy="Never"' ./testimagedep.yaml
          kubectl apply -f testimagedep.yaml --namespace=meshery
          kubectl apply -f https://raw.githubusercontent.com/meshery/meshery/master/install/deployment_yamls/k8s/meshery-kuma-service.yaml --namespace=meshery
      - name: Start tunelling
        run: minikube tunnel &> /dev/null &
      - name: Check Meshery pod logs
        run: |
          SECONDS=0
          end=$((SECONDS+300))
          while [ $SECONDS -lt $end ]; do
            status=$(mesheryctl system  status -v | sed -n 2p | sed -e "s/[[:space:]]\+/ /g" |  cut -d " " -f 3)
            if [ "$status" = "Running" ];then
              break
            fi
          done
          mesheryctl system  logs meshery
      - name: Reset Meshery address
        run: |
          kubectl get svc -n meshery
          NODE_IP=$(minikube ip)
          NODE_PORT=$(kubectl get svc meshery -n meshery -o jsonpath='{.spec.ports[0].nodePort}')
          if [ -z "$NODE_IP" ] || [ -z "$NODE_PORT" ]; then
            echo "Could not determine Meshery NodePort endpoint (ip=$NODE_IP port=$NODE_PORT)"
            exit 1
          fi
          svcip="http://${NODE_IP}:${NODE_PORT}"
          echo "this is $svcip"
          reachable=0
          for i in $(seq 1 60); do
            http_code=$(curl -sS -o /tmp/meshery_probe.txt -w "%{http_code}" --max-time 5 "$svcip/api/system/version" || true)
            echo "probe $i: HTTP $http_code"
            if [ -n "$http_code" ] && [ "$http_code" != "000" ]; then
              reachable=1
              break
            fi
            sleep 5
          done
          if [ "$reachable" -ne 1 ]; then
            echo "Meshery did not become reachable at $svcip"
            kubectl get pods,svc -n meshery
            exit 1
          fi
          jq -n --arg endpoint "$svcip" '{"contexts":{"local":{"endpoint":$endpoint,"token":"default","platform":"kubernetes","adapters":[],"channel":"stable","version":"latest"}},"current-context":"local","tokens":[{"location":"auth.json","name":"default"}]}' > ~/.meshery/config.yaml
          cat ~/.meshery/config.yaml
      - name: Download patternfile
        uses: actions/download-artifact@v7
        with:
          name: patternfile
      - name: Wait for Meshery pods to come up
        run: sleep 100
      - name: Pattern apply
        run: |
          cat ./deploy.yaml
          mesheryctl design apply -f ./deploy.yaml
      - name: Sleep 120 seconds
        run: sleep 120
      - name: Pattern apply, second iteration. [IDEMPOTENT]
        run: |
          cat ./deploy.yaml
          mesheryctl design apply -f ./deploy.yaml
      - name: Check adapter logs
        if: always()
        run: |
          podname=$(kubectl get pods -n meshery | grep kuma | tr -s ' ' | cut -d " " -f 1)
          kubectl logs pod/$podname -n meshery
      - name: Check Meshery logs
        if: always()
        run: mesheryctl system  logs meshery
      - name: Whole status for debugging
        if: always()
        run: kubectl get all -A
      - name: Check if all expected resources have started
        run: |
          SECONDS=0
          exitstatus=0
          end=$((SECONDS+300))
          set -f
          resources=(kuma-control-plane)
          types=(pod)
          ns=(kuma)
          breakout=1
          while [ $SECONDS -lt $end ]; do
            for i in "${!resources[@]}"
            do
              resourceinfo=$(kubectl get ${types[i]} -n ${ns[i]} | grep ${resources[i]} | tr -s ' ')
              resourcestarted=$(echo $resourceinfo | cut -d " " -f 1)
              resourcestatus=$(echo $resourceinfo | cut -d " " -f 3)
              if [[ ("${types[i]}" = "pod" && "$resourcestatus" != "Running") || ("${types[i]}" != "pod" && "$resourcestarted" = "") ]];then
                breakout=0
              fi
            done
            if [ $breakout -eq 1 ];then
              break
            fi
            breakout=1
          done
          touch data.json
          runon=$(date)
          itran=0
          itdidnotrun=0
          echo "Ran on $runon"
          echo '{"metadata":{ "k8s_version":"'${{ matrix.k8s_version }}'", "service_mesh_name":"kuma", "service_mesh_version":"'${{ needs.SetPatternfile.outputs.sm_version }}'","adapter_version":"'${{ needs.SetPatternfile.outputs.adapter_version }}'" ,"runon":"'$runon'"}, "resources_status":{}, "overall-status":""}' | jq > ./data.json
          for i in "${!resources[@]}"
          do
            resourceinfo=$(kubectl get ${types[i]} -n ${ns[i]} | grep ${resources[i]} | tr -s ' ')
            resourcestarted=$(echo $resourceinfo | cut -d " " -f 1)
            resourcestatus=$(echo $resourceinfo | cut -d " " -f 3)
            if [[ ("${types[i]}" = "pod" && "$resourcestatus" = "Running") || ("${types[i]}" != "pod" && "$resourcestarted" != "") ]];then
              itran=1
              echo "${types[i]} ${resources[i]} started in namespace ${ns[i]}"
              echo $(jq '.resources_status."'${types[i]}/${resources[i]}'" |= "Running"' data.json) > data.json
            else
              itdidnotrun=1
              echo "${types[i]} ${resources[i]} did not start in namespace ${ns[i]} "
              echo $(jq '.resources_status."'${types[i]}/${resources[i]}'" |= "Not Running"' data.json) > data.json
              exitstatus=1
            fi
          done
          status=""
          if [ "$exitstatus" -eq 0 ];then
            status="passing"
          else
            status="failing"
          fi
          if [ "$itran" -eq 1 ] && [ "$itdidnotrun" -eq 1 ] ;then
            status="partial"
          fi
          echo $(jq '."overall-status" |= "'$status'"' data.json) > data.json
          MESHERY_VERSION=$(curl -L -s https://github.com/meshery/meshery/releases/latest | grep -oP 'releases/tag/\K[^"]+' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo $(jq '.metadata."meshery-server-version" |="'$MESHERY_VERSION'"' data.json ) > data.json
          echo "exitstatus=$exitstatus" >> $GITHUB_ENV
      - name: UploadResults (Versioned)
        uses: actions/upload-artifact@v6
        with:
          name: data.json-${{ matrix.k8s_version }}
          path: ./data.json
          overwrite: true
          continue-on-error: true
      - name: UploadResults (Legacy)
        uses: actions/upload-artifact@v6
        with:
          name: data.json
          path: ./data.json
          overwrite: true
          continue-on-error: true
      - name: exit
        run: |
          if [ "$exitstatus" -eq 1 ];then
            exit 1
          fi

  UpdateDocs:
    needs: TestKuma
    if: ${{ needs.TestKuma.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip if needed
        run: |
            echo "this is it ${{ needs.SkipIfNeeded.outputs.skipdocupdate }} "
            if [ "${{github.event_name }}" == "push" ];then
              echo "version=edge" >> $GITHUB_ENV
            fi
            if [ "${{github.event_name }}" == "release" ];then
              echo "version=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV
            fi
      - uses: actions/checkout@master
        with:
          repository: meshery/meshery 
          token: ${{ secrets.GH_ACCESS_TOKEN }}   
          ref: master
      - name: DownloadJSON
        uses: actions/download-artifact@v4.1.7
        with:
          name: data.json
      - name: Add commit SHORT_SHA
        run: echo "SHORT_SHA=`echo ${GITHUB_SHA} | cut -c1-8`" >> $GITHUB_ENV
      - name: echo results
        run: |
          pretty=$(jq . data.json)
          rm data.json
          mkdir -p ./docs/content/en/project/compatibility/meshery-kuma
          cd ./docs/content/en/project/compatibility/meshery-kuma
          touch data.json
          echo $pretty > data.json
          cat data.json
          touch test.md
          filename=(`date +%m-%d-%Y-%H-%M-%m_${SHORT_SHA}`)
          echo $filename
          echo "---
          timestamp: $(jq '.metadata.runon| strptime("%a %b %e %X %Z %Y") | strftime("%Y-%m-%d %X %Z %a")' data.json)
          meshery-component: meshery-kuma
          meshery-component-version: $version
          meshery-server-version: $(jq '.metadata."meshery-server-version"' data.json)
          k8s-distro: minikube
          k8s-version: $(jq '.metadata.k8s_version' data.json)
          service-mesh: Kuma
          service-mesh-version: $(jq '.metadata.service_mesh_version' data.json)
          tests:
            pod/kuma-control-plane: $(jq '.resources_status."pod/kuma-control-plane"' data.json)
          overall-status: $(jq '."overall-status"' data.json)
          ---" >  test.md
          mv test.md $filename.md
          rm data.json
      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          file_pattern: docs
          commit_user_name: l5io
          commit_user_email: ci@layer5.io
          commit_author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          commit_options: '--signoff'
          commit_message: '[Docs] Test status of adapter'
